<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="700" x2="600" y2="700"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="220" r="140" fill="#10b981" opacity="0.18" filter="url(#glow)"/>
  <circle cx="450" cy="580" r="160" fill="#2563eb" opacity="0.22" filter="url(#glow)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="552" height="752" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <rect x="36" y="36" width="528" height="728" rx="20" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Top Badge: SPONSORED ADS -->
  <g transform="translate(300, 85)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
    <g transform="translate(-108, -9) scale(0.75)" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 11 18-5v12L3 13v-2z" fill="rgba(16,185,129,0.2)"/>
      <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
    </g>
    <text x="12" y="5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="2">
      ОФІЦІЙНА РЕКЛАМА
    </text>
  </g>

  <!-- Center Branded Logo Emblem -->
  <g transform="translate(300, 220)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.75"/>
    <rect x="-56" y="-56" width="112" height="112" rx="30" fill="url(#logoGrad)" filter="url(#glow)"/>
    <rect x="-56" y="-56" width="112" height="112" rx="30" fill="url(#logoGrad)"/>
    <text x="0" y="24" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">
      L
    </text>
  </g>

  <!-- Brand Title -->
  <text x="300" y="335" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Loop<tspan fill="#10b981">Market</tspan> <tspan fill="#38bdf8" font-size="20" font-weight="800">ADS</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="180" y1="365" x2="420" y2="365" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Headline: ТУТ МОГЛА БУТИ ВАША РЕКЛАМА -->
  <text x="300" y="430" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    ТУТ МОГЛА БУТИ
  </text>
  <text x="300" y="475" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-0.5">
    ВАША РЕКЛАМА!
  </text>

  <!-- Subtitle -->
  <text x="300" y="535" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Залучайте тисячі покупців щодня для вашого бізнесу
  </text>
  <text x="300" y="562" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">
    Товари • Послуги • Брендові пропозиції • Акції
  </text>

  <!-- Features Pills -->
  <g transform="translate(110, 600)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
    <g transform="translate(26, 9) scale(0.68)" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </g>
    <text x="98" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">
      ТОП позиції
    </text>
  </g>
  <g transform="translate(310, 600)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
    <g transform="translate(20, 9) scale(0.68)" fill="rgba(56,189,248,0.28)" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </g>
    <text x="100" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">
      Прямий трафік
    </text>
  </g>

  <!-- Call to action button box inside image -->
  <g transform="translate(300, 690)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="url(#logoGrad)"/>
    <text x="-12" y="6" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      РОЗМІСТИТИ РЕКЛАМУ
    </text>
    <g transform="translate(106, -9) scale(0.75)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </g>
  </g>
</svg>
