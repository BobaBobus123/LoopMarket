<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lmServBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lmServLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="lmServGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="lmServShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#lmServBg)" />
  <rect width="800" height="600" fill="url(#lmServGlow)" />

  <!-- Ambient Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Central Emblem Container -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Outer Glow Ring -->
    <circle r="68" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6" />
    
    <!-- Logo Box -->
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="url(#lmServLogoGrad)" filter="url(#lmServShadow)" />
    
    <!-- L Character inside logo -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', -apple-system, system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">L</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(400, 375)" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text font-size="36" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#f8fafc">Loop</tspan>
      <tspan fill="#38bdf8">Services</tspan>
    </text>
  </g>

  <!-- Pill Badge: Service or Work -->
  <g transform="translate(400, 435)">
    <!-- Pill background -->
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">
      🛠 Послуга або робота фахівця
    </text>
  </g>

  <!-- Bottom Slogan -->
  <text x="400" y="525" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.3">
    Прямий зв'язок з перевіреними майстрами
  </text>
</svg>
