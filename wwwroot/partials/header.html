<header class="site-header" role="banner">
    <!-- Ліва частина: замість 'Кременчук' додано компактний селектор кампуса -->
    <div class="header-left">
        <div class="location-badge">📍 Кременчук ▾</div>
    </div>

    <!-- Центр: оригинальный SVG логотип с главной страницы -->
    <div class="header-center">
        <a href="/index.html" class="logo-link" aria-label="Loop Market">
            <svg width="190" height="42" viewBox="0 0 210 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M38 12C28.0589 12 20 20.0589 20 30C20 39.9411 28.0589 48 38 48C47.9411 48 56 39.9411 56 30C56 24.5 53.5 19.5 49.5 16L32.5 33" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M22 38C12.0589 38 4 29.9411 4 20C4 10.0589 12.0589 2 22 2C31.9411 2 40 10.0589 40 20C40 25.5 37.5 30.5 33.5 34L16.5 17" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                <text x="68" y="37" fill="var(--text-main)" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8px">Market</text>
            </svg>
        </a>
    </div>

    <!-- Права частина: іконки, тема, профіль, кнопки -->
    <div class="header-right">
        <div id="dynamicIcons" class="header-icons">
            <a href="/messages.html" class="icon-btn" aria-label="Повідомлення">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <a href="/profile.html" class="icon-btn" aria-label="Профіль">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>

        <button class="theme-toggle" id="themeToggleBtn" aria-label="Перемкнути тему">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
        </button>

        <div class="header-buttons" id="headerButtons">
            <a href="/login.html" class="btn-outline">Увійти</a>
            <a href="/create.html" class="btn-primary">Подати оголошення</a>
        </div>
    </div>
</header>
