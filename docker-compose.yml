services:
  postgres:
    image: postgres:16-alpine
    container_name: loopmarket_postgres
    restart: always
    environment:
      POSTGRES_USER: loopmarket_user
      POSTGRES_PASSWORD: loopmarket_password123
      POSTGRES_DB: loopmarket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loopmarket_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@loopmarket.com
      PGADMIN_DEFAULT_PASSWORD: admin_password123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
